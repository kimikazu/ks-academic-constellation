# --- サイト基本 ---
title: "KS Research Notes / 研究ノート"
lang: ja
description: "A living lab notebook: research notes, literature, and links — 研究ノート・文献メモ・リンク集"
url: "https://kimikazu.github.io"
baseurl: "/ks-academic-constellation"

theme: minima

# --- Markdown/レンダリング ---
markdown: kramdown
kramdown:
  input: GFM
permalink: pretty

# --- Mermaid & 数式（ページ毎にフラグでON/OFF可）---
# 使い方: 各ページのFront Matterに mermaid: true / math: true を書く
# （グローバルに常時ONなら defaults に入れてもOK）
mermaid: true
use_math: true

# --- プラグイン（GitHub Pages対応）---
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# --- コレクション ---
collections:
  notes:
    output: true
    permalink: /notes/:name/
  links:
    output: false   # 外部リンクの台帳。個別ページは作らない / bookmark records only

defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: note
      type: note
      status: seed

# --- ヘッダーのナビゲーション（表示順）/ Header navigation order ---
header_pages:
  - notes/index.md
  - links/index.md
  - confs.md
  - docs/concentric.md

# --- ビルド対象外 / Excluded from the site ---
exclude:
  - README.md
  - _templates/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/

# Minima config (optional tweaks)
minima:
  date_format: "%Y-%m-%d"
  skin: classic
  social_links:       # フッターのSNS/外部リンク（必要に応じて）
    github: kimikazu
    website: https://sites.google.com/view/ksugimori/

# --- フィード/サイトマップ ---
feed:
  collections:   # links は個別ページを持たないので配信しない / links have no pages, so no feed
    - notes
  posts_limit: 50


